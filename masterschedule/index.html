<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>企業カード事業 開発ガントチャート</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --panel: #ffffff;
      --line: #e2e8f0;
      --line-soft: #f1f5f9;
      --text: #0f172a;
      --muted: #64748b;
      --muted-2: #94a3b8;
      --indigo: #4f46e5;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      --phase-w: 140px;
      --id-w: 46px;
      --task-w: 280px;
      --week-w: 28px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .header-inner, main, .footer-inner {
      width: min(1280px, calc(100vw - 32px));
      margin: 0 auto;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      color: #fff;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 12px;
      box-shadow: 0 10px 24px rgba(79, 70, 229, 0.18);
      flex: 0 0 auto;
    }

    .brand h1 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #c7d2fe;
      background: #eef2ff;
      color: #4338ca;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    main {
      padding: 24px 0;
    }

    .toolbar, .chart-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }

    .toolbar {
      padding: 16px;
      margin-bottom: 16px;
    }

    .toolbar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .search-wrap {
      position: relative;
      width: min(100%, 340px);
    }

    .search-wrap svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted-2);
      pointer-events: none;
    }

    #search {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px 0 36px;
      color: var(--text);
      background: #fff;
      outline: none;
      font-size: 13px;
    }

    #search:focus {
      border-color: var(--indigo);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .filters, .legend {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn, .nav-btn {
      border: 1px solid var(--line);
      background: #f8fafc;
      color: #475569;
      border-radius: 8px;
      min-height: 34px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      transition: background 140ms ease, color 140ms ease, border-color 140ms ease, transform 80ms ease;
    }

    .filter-btn:hover, .nav-btn:hover { background: #f1f5f9; }
    .filter-btn:active, .nav-btn:active { transform: scale(0.98); }
    .filter-btn.active {
      background: var(--indigo);
      border-color: var(--indigo);
      color: #fff;
    }

    .legend {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line-soft);
      font-size: 11px;
      color: var(--muted);
    }

    .legend strong {
      color: #475569;
      margin-right: 2px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      background: #fff;
      font-size: 10px;
      font-weight: 800;
      color: #475569;
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--dot, #64748b);
    }

    .chart-card {
      overflow: hidden;
    }

    .chart-viewport {
      overflow: auto;
      max-height: 64vh;
      scrollbar-color: #cbd5e1 #f1f5f9;
    }

    .chart-viewport::-webkit-scrollbar { width: 8px; height: 8px; }
    .chart-viewport::-webkit-scrollbar-track { background: #f1f5f9; }
    .chart-viewport::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 8px;
      border: 2px solid #f1f5f9;
    }

    table {
      width: calc(var(--phase-w) + var(--id-w) + var(--task-w) + (44 * var(--week-w)));
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      font-size: 12px;
    }

    th, td {
      border-right: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line-soft);
      height: 44px;
      padding: 0;
      background: #fff;
      vertical-align: middle;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #f8fafc;
      color: #475569;
      font-weight: 800;
      height: 38px;
      border-bottom: 1px solid var(--line);
    }

    thead tr:nth-child(2) th {
      top: 38px;
      height: 28px;
      color: #94a3b8;
      font-size: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .sticky-phase, .sticky-id, .sticky-task {
      position: sticky;
      z-index: 30;
      box-shadow: 2px 0 5px rgba(15, 23, 42, 0.04);
    }

    .sticky-phase { left: 0; width: var(--phase-w); min-width: var(--phase-w); }
    .sticky-id { left: var(--phase-w); width: var(--id-w); min-width: var(--id-w); text-align: center; }
    .sticky-task { left: calc(var(--phase-w) + var(--id-w)); width: var(--task-w); min-width: var(--task-w); }

    thead .sticky-phase, thead .sticky-id, thead .sticky-task {
      z-index: 40;
      background: #f1f5f9;
    }

    tbody tr:hover td { background: #f8fafc; }

    .phase-cell {
      padding: 0 8px;
      font-weight: 800;
      font-size: 11px;
    }

    .id-cell {
      color: #94a3b8;
      font-weight: 800;
    }

    .task-cell {
      padding: 0 10px;
      color: #1e293b;
      font-weight: 800;
    }

    .task-button {
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      font-weight: inherit;
      padding: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .task-button:hover { color: var(--indigo); }

    .badge {
      display: inline-flex;
      max-width: 100%;
      border: 1px solid var(--phase-line, #cbd5e1);
      color: var(--phase-text, #475569);
      background: var(--phase-bg, #f8fafc);
      border-radius: 999px;
      padding: 3px 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .week-cell {
      width: var(--week-w);
      min-width: var(--week-w);
      background: #f8fafc;
    }

    .bar-cell {
      position: relative;
      background: #fff;
    }

    .bar {
      position: absolute;
      inset: 7px 3px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      color: #0f172a;
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 3px 10px rgba(15, 23, 42, 0.08);
    }

    .bar:focus-visible, .task-button:focus-visible, button:focus-visible {
      outline: 3px solid rgba(79, 70, 229, 0.24);
      outline-offset: 2px;
    }

    .footer-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      background: #f8fafc;
      color: var(--muted);
      font-size: 12px;
      flex-wrap: wrap;
    }

    .footer-status strong {
      color: var(--text);
      font-size: 15px;
    }

    .empty {
      height: 140px;
      text-align: center;
      color: var(--muted-2);
      font-weight: 700;
      background: #f8fafc;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(15, 23, 42, 0.42);
      backdrop-filter: blur(8px);
    }

    .modal.open { display: flex; }

    .dialog {
      width: min(560px, 100%);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      transform: translateY(6px) scale(0.98);
      opacity: 0;
      transition: transform 160ms ease, opacity 160ms ease;
    }

    .modal.open .dialog {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .dialog-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 22px;
      border-bottom: 1px solid var(--line);
    }

    .dialog-head h2 {
      margin: 12px 0 0;
      font-size: 17px;
      letter-spacing: 0;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 8px;
      background: #f8fafc;
      color: #475569;
      font-size: 20px;
      line-height: 1;
    }

    .dialog-body {
      padding: 22px;
      font-size: 13px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .meta {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
      padding: 12px;
    }

    .meta span {
      display: block;
      color: var(--muted-2);
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .meta strong { font-size: 14px; }

    .desc-label {
      display: block;
      color: var(--muted-2);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .desc-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
      padding: 14px;
      color: #475569;
      max-height: 180px;
      overflow: auto;
    }

    .dialog-actions {
      padding: 16px 22px;
      border-top: 1px solid var(--line);
      background: #f8fafc;
      text-align: right;
    }

    .primary {
      border: 1px solid var(--indigo);
      background: var(--indigo);
      color: #fff;
      border-radius: 8px;
      min-height: 36px;
      padding: 8px 18px;
      font-size: 12px;
      font-weight: 800;
    }

    footer {
      border-top: 1px solid var(--line);
      background: #fff;
      color: var(--muted-2);
      font-size: 12px;
      text-align: center;
      padding: 20px 0;
    }

    @media (max-width: 760px) {
      :root {
        --phase-w: 120px;
        --task-w: 230px;
      }
      .header-inner { align-items: flex-start; flex-direction: column; }
      .brand h1 { font-size: 15px; }
      .toolbar-top { align-items: stretch; }
      .search-wrap { width: 100%; }
      .meta-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M8 7v10M14 7v10" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".75"/>
          </svg>
        </div>
        <div>
          <h1>企業カード事業 開発ガントチャート <span class="pill">公開用HTML</span></h1>
          <p>CSVデータ同期版。検索、フェーズ絞り込み、詳細メモ確認に対応。</p>
        </div>
      </div>
      <button class="nav-btn" id="scroll-start" type="button">初期位置へ</button>
    </div>
  </header>

  <main>
    <section class="toolbar" aria-label="チャート操作">
      <div class="toolbar-top">
        <label class="search-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m21 21-4.35-4.35M18 10.5a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="search" type="search" placeholder="タスク名、フェーズ、#IDで検索">
        </label>
        <div class="filters" id="filters">
          <button class="filter-btn active" type="button" data-filter="all">すべて表示</button>
          <button class="filter-btn" type="button" data-filter="prepare">事前準備</button>
          <button class="filter-btn" type="button" data-filter="kickoff">キックオフ</button>
          <button class="filter-btn" type="button" data-filter="negotiation">Sponsor交渉・要件</button>
          <button class="filter-btn" type="button" data-filter="selection">製品選定・設計</button>
          <button class="filter-btn" type="button" data-filter="dev">開発・テスト</button>
          <button class="filter-btn" type="button" data-filter="operation">業務準備</button>
          <button class="filter-btn" type="button" data-filter="release">リリース・POC</button>
        </div>
      </div>
      <div class="legend" id="legend">
        <strong>カラー凡例:</strong>
      </div>
    </section>

    <section class="chart-card" aria-label="ガントチャート">
      <div class="chart-viewport" id="viewport">
        <table aria-describedby="chart-note">
          <colgroup id="cols"></colgroup>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="footer-status" id="chart-note">
        <span>表示中: <strong id="visible-count">0</strong> / <span id="total-count">0</span> タスク</span>
        <span>プロジェクト総期間: 11ヶ月 (44週間)</span>
        <span>タスク名やバーをクリックすると詳細メモを確認できます。</span>
      </div>
    </section>
  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="dialog">
      <div class="dialog-head">
        <div>
          <span class="badge" id="modal-phase">PHASE</span>
          <h2 id="modal-title">タスク名</h2>
        </div>
        <button class="icon-btn" id="modal-x" type="button" aria-label="閉じる">×</button>
      </div>
      <div class="dialog-body">
        <div class="meta-grid">
          <div class="meta">
            <span>タスク番号</span>
            <strong id="modal-id">#--</strong>
          </div>
          <div class="meta">
            <span>想定スケジュール期間</span>
            <strong id="modal-period">--</strong>
          </div>
        </div>
        <span class="desc-label">タスクの詳細と役割</span>
        <div class="desc-box" id="modal-desc"></div>
      </div>
      <div class="dialog-actions">
        <button class="primary" id="modal-close" type="button">閉じる</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-inner">© 2026 企業カード事業 開発プロジェクトマネジメント</div>
  </footer>

    const taskDescriptions = {

      29: "決済ネットワークにデータを流し、正常なオーソリゼーションメッセージ、レスポンスが規定のプロトコルに合致するか判定するブランド公式試験。",
      30: "カード会員情報、チャージ機能、限度額コントロール、利用履歴などをリアルタイムに反映させるためのイシュアホストプロセッサ開発。",
      34: "正式稼働前のアルファ・ベータ版を導入・検証してもらうためのパートナー企業数社の選定と、検証協力に関する交渉・合意。",

      42: "実際の送金・決済データをもとに、精算バッチが正確に回るか、システム上の預託残高と銀行残高が照合するか、実務体制を含めた徹底検証。",
      43: "実商用環境における正式サービスイン。すべてのユーザーに対して本番カードの発行・決済機能を全面解放します。"
    };

    const months = ["6月", "7月", "8月", "9月", "10月", "11月", "12月", "1月", "2月", "3月", "4月"];
    const tagMap = {
      "事前準備・確認": "prepare",
      "キックオフ": "kickoff",
      "Sponsor交渉/要件定義": "negotiation",
      "周辺製品・サービス選定": "selection",
      "開発": "dev",
      "業務準備": "operation",
      "システムリリース": "release",
      "POC": "release",
      "リリース": "release"
    };

    const themes = {
      "事前準備・確認": { bg: "#ecfdf5", text: "#047857", line: "#a7f3d0", dot: "#10b981", bar: "linear-gradient(90deg,#34d399,#5eead4)" },
      "キックオフ": { bg: "#eff6ff", text: "#1d4ed8", line: "#bfdbfe", dot: "#3b82f6", bar: "linear-gradient(90deg,#60a5fa,#818cf8)" },
      "Sponsor交渉/要件定義": { bg: "#faf5ff", text: "#7e22ce", line: "#e9d5ff", dot: "#a855f7", bar: "linear-gradient(90deg,#a78bfa,#f0abfc)" },
      "周辺製品・サービス選定": { bg: "#fffbeb", text: "#b45309", line: "#fde68a", dot: "#f59e0b", bar: "linear-gradient(90deg,#fbbf24,#fde047)" },
      "開発": { bg: "#eef2ff", text: "#4338ca", line: "#c7d2fe", dot: "#6366f1", bar: "linear-gradient(90deg,#818cf8,#67e8f9)" },
      "業務準備": { bg: "#fff7ed", text: "#c2410c", line: "#fed7aa", dot: "#f97316", bar: "linear-gradient(90deg,#fb923c,#fbbf24)" },
      "システムリリース": { bg: "#fff1f2", text: "#be123c", line: "#fecdd3", dot: "#f43f5e", bar: "linear-gradient(90deg,#fb7185,#f9a8d4)" },
      "POC": { bg: "#fff1f2", text: "#be123c", line: "#fecdd3", dot: "#f43f5e", bar: "linear-gradient(90deg,#fb7185,#f9a8d4)" },
      "リリース": { bg: "#fff1f2", text: "#be123c", line: "#fecdd3", dot: "#f43f5e", bar: "linear-gradient(90deg,#fb7185,#f9a8d4)" }
    };

    const fallbackTheme = { bg: "#f8fafc", text: "#475569", line: "#e2e8f0", dot: "#64748b", bar: "linear-gradient(90deg,#94a3b8,#cbd5e1)" };
    const state = { filter: "all", query: "" };
    let tasks = [];

    const $ = (selector) => document.querySelector(selector);

    function splitCSVLine(line) {
      const out = [];
      let current = "";
      let quoted = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') quoted = !quoted;
        else if (char === "," && !quoted) {
          out.push(current);
          current = "";
        } else {
          current += char;
        }
      }
      out.push(current);
      return out;
    }

    function parseTasks() {
      const lines = rawCSVData.split(/\r?\n/).filter(Boolean);
      const parsed = [];
      for (let i = 2; i < lines.length; i++) {
        const cols = splitCSVLine(lines[i]);
        const phase = (cols[0] || "").trim();
        const id = Number((cols[1] || "").trim());
        const title = (cols[2] || "").trim();
        if (!phase || !id || !title) continue;

        const ranges = [];
        let start = -1;
        for (let w = 0; w < 44; w++) {
          const cell = cols[w + 3] || "";
          const active = cell.includes("■") || cell.trim() !== "";
          if (active && start === -1) start = w + 1;
          if (!active && start !== -1) {
            ranges.push({ start, end: w });
            start = -1;
          }
        }
        if (start !== -1) ranges.push({ start, end: 44 });
        if (!ranges.length) continue;

        parsed.push({
          phase,
          id,
          title,
          ranges,
          start: ranges[0].start,
          end: ranges[0].end,
          tag: tagMap[phase] || "other",
          desc: taskDescriptions[id] || "このタスクの詳細はプロジェクト運営方針に準じます。"
        });
      }
      return parsed;
    }

    function weekLabel(index) {
      const monthIndex = Math.floor((index - 1) / 4);
      const week = ((index - 1) % 4) + 1;
      return `${months[monthIndex] || ""} 第${week}週`;
    }

    function rangeLabel(start, end) {
      return start === end ? weekLabel(start) : `${weekLabel(start)} 〜 ${weekLabel(end)}`;
    }

    function themeFor(phase) {
      return themes[phase] || fallbackTheme;
    }

    function applyThemeVars(element, theme) {
      element.style.setProperty("--phase-bg", theme.bg);
      element.style.setProperty("--phase-text", theme.text);
      element.style.setProperty("--phase-line", theme.line);
      element.style.setProperty("--dot", theme.dot);
    }

    function buildSkeleton() {
      const cols = $("#cols");
      cols.innerHTML = '<col style="width: var(--phase-w)"><col style="width: var(--id-w)"><col style="width: var(--task-w)">' + Array.from({ length: 44 }, () => '<col style="width: var(--week-w)">').join("");

      $("#thead").innerHTML = `
        <tr>
          <th class="sticky-phase">フェーズ</th>
          <th class="sticky-id">#</th>
          <th class="sticky-task">タスク名</th>
          ${months.map((month) => `<th colspan="4">${month}</th>`).join("")}
        </tr>
        <tr>
          <th class="sticky-phase"></th>
          <th class="sticky-id"></th>
          <th class="sticky-task"></th>
          ${Array.from({ length: 44 }, (_, index) => `<th>w${(index % 4) + 1}</th>`).join("")}
        </tr>
      `;

      const legendNames = ["事前準備・確認", "キックオフ", "Sponsor交渉/要件定義", "周辺製品・サービス選定", "開発", "業務準備", "システムリリース"];
      $("#legend").insertAdjacentHTML("beforeend", legendNames.map((name) => {
        const theme = themeFor(name);
        return `<span class="legend-item" style="--dot:${theme.dot}"><span class="dot"></span>${name}</span>`;
      }).join(""));
    }

    function filteredTasks() {
      const query = state.query.trim().toLowerCase();
      return tasks.filter((task) => {
        const phaseOk = state.filter === "all" || task.tag === state.filter;
        const queryOk = !query || task.title.toLowerCase().includes(query) || task.phase.toLowerCase().includes(query) || String(task.id).includes(query);
        return phaseOk && queryOk;
      });
    }

    function render() {
      const tbody = $("#tbody");
      const items = filteredTasks();
      $("#visible-count").textContent = items.length;
      $("#total-count").textContent = tasks.length;
      tbody.innerHTML = "";

      if (!items.length) {
        tbody.innerHTML = '<tr><td class="empty" colspan="47">該当するタスクが見つかりませんでした。</td></tr>';
        return;
      }

      const fragment = document.createDocumentFragment();
      items.forEach((task) => {
        const theme = themeFor(task.phase);
        const tr = document.createElement("tr");

        const phaseTd = document.createElement("td");
        phaseTd.className = "sticky-phase phase-cell";
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = task.phase;
        applyThemeVars(badge, theme);
        phaseTd.appendChild(badge);
        tr.appendChild(phaseTd);

        const idTd = document.createElement("td");
        idTd.className = "sticky-id id-cell";
        idTd.textContent = task.id;
        tr.appendChild(idTd);

        const taskTd = document.createElement("td");
        taskTd.className = "sticky-task task-cell";
        const taskButton = document.createElement("button");
        taskButton.className = "task-button";
        taskButton.type = "button";
        taskButton.textContent = task.title;
        taskButton.addEventListener("click", () => showModal(task));
        taskTd.appendChild(taskButton);
        tr.appendChild(taskTd);

        let week = 1;
        while (week <= 44) {
          const range = task.ranges.find((item) => week >= item.start && week <= item.end);
          if (range && week === range.start) {
            const span = range.end - range.start + 1;
            const td = document.createElement("td");
            td.className = "bar-cell";
            td.colSpan = span;
            const bar = document.createElement("button");
            bar.type = "button";
            bar.className = "bar";
            bar.style.background = theme.bar;
            bar.title = `${task.title}\n${rangeLabel(range.start, range.end)}`;
            bar.textContent = span > 1 ? task.title : `#${task.id}`;
            bar.addEventListener("click", () => showModal(task));
            td.appendChild(bar);
            tr.appendChild(td);
            week += span;
          } else {
            const td = document.createElement("td");
            td.className = "week-cell";
            tr.appendChild(td);
            week++;
          }
        }
        fragment.appendChild(tr);
      });
      tbody.appendChild(fragment);
    }

    function showModal(task) {
      const theme = themeFor(task.phase);
      $("#modal-id").textContent = `#${task.id}`;
      $("#modal-title").textContent = task.title;
      $("#modal-period").textContent = rangeLabel(task.start, task.end);
      $("#modal-desc").textContent = task.desc;
      $("#modal-phase").textContent = task.phase;
      applyThemeVars($("#modal-phase"), theme);
      $("#modal").classList.add("open");
    }

    function hideModal() {
      $("#modal").classList.remove("open");
    }

    function bindEvents() {
      $("#search").addEventListener("input", (event) => {
        state.query = event.target.value;
        render();
      });

      $("#filters").addEventListener("click", (event) => {
        const button = event.target.closest(".filter-btn");
        if (!button) return;
        document.querySelectorAll(".filter-btn").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        state.filter = button.dataset.filter;
        render();
      });

      $("#scroll-start").addEventListener("click", () => {
        $("#viewport").scrollTo({ left: 0, top: 0, behavior: "smooth" });
      });

      $("#modal-x").addEventListener("click", hideModal);
      $("#modal-close").addEventListener("click", hideModal);
      $("#modal").addEventListener("click", (event) => {
        if (event.target.id === "modal") hideModal();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") hideModal();
      });
    }

    tasks = parseTasks();
    buildSkeleton();
    bindEvents();
    render();
  </script>
